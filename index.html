<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الاختبارات التفاعلية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f3f4f6; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .question-card { transition: all 0.3s ease; }
        .question-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .no-select { user-select: none; -webkit-user-select: none; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 py-10 px-4">

    <!-- ================= لوحة المعلم ================= -->
    <div id="teacher-panel" class="max-w-5xl mx-auto glass rounded-2xl shadow-xl p-8 mb-10 hidden">
        <h1 class="text-3xl font-extrabold text-indigo-700 mb-2">👨‍🏫 لوحة المعلم</h1>
        
        <!-- قسم إنشاء الاختبار -->
        <div class="mb-8 border-b pb-8">
            <h2 class="text-xl font-bold mb-4 text-gray-800">1. إنشاء اختبار جديد</h2>
            <textarea id="questions-input" class="w-full h-40 p-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none resize-none" placeholder="اكتب أسئلتك هنا..."></textarea>
            <button onclick="generateQuizLink()" class="mt-4 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl transition">
                ✨ تحويل إلى اختبار ونسخ الرابط
            </button>
            <p id="link-success" class="text-green-600 font-bold mt-3 hidden text-center">✅ تم نسخ الرابط بنجاح!</p>
        </div>

        <!-- قسم عرض نتائج الطلاب -->
        <div>
            <h2 class="text-xl font-bold mb-4 text-gray-800">2. استعراض إجابات الطلاب</h2>
            <div class="flex gap-4 mb-6">
                <input type="password" id="teacher-password" class="flex-1 p-3 border border-gray-300 rounded-lg outline-none" placeholder="أدخل كلمة المرور لعرض النتائج...">
                <button onclick="fetchResults()" id="fetch-btn" class="bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-6 rounded-lg transition">
                    🔍 جلب البيانات
                </button>
            </div>
            
            <div id="results-container" class="hidden overflow-x-auto">
                <table class="w-full text-right bg-white rounded-lg overflow-hidden shadow">
                    <thead class="bg-gray-800 text-white">
                        <tr>
                            <th class="p-3">اسم الطالب</th>
                            <th class="p-3">الصف</th>
                            <th class="p-3">مخالفات الغش</th>
                            <th class="p-3 text-center">الإجابات التفصيلية</th>
                        </tr>
                    </thead>
                    <tbody id="results-body" class="divide-y divide-gray-200">
                        <!-- سيتم إدراج النتائج هنا -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ================= لوحة الطالب ================= -->
    <div id="student-panel" class="max-w-3xl mx-auto hidden no-select">
        
        <div id="student-info-step" class="glass rounded-2xl shadow-xl p-8">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-extrabold text-gray-800">📝 اختبار تقييمي</h2>
                <p class="text-red-500 font-bold mt-2 text-sm">⚠️ وضع التركيز الآمن مُفعل (يمنع الخروج من الصفحة أو النسخ).</p>
            </div>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-gray-700 font-bold mb-2">الاسم الرباعي</label>
                    <input type="text" id="s-name" class="w-full p-3 border border-gray-300 rounded-lg outline-none" required>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-700 font-bold mb-2">الصف والشعبة</label>
                        <input type="text" id="s-grade" class="w-full p-3 border border-gray-300 rounded-lg outline-none" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 font-bold mb-2">رقم الطالب</label>
                        <input type="number" id="s-id" class="w-full p-3 border border-gray-300 rounded-lg outline-none" required>
                    </div>
                </div>
                <button onclick="startQuiz()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-xl transition mt-4">
                    🚀 بدء الاختبار
                </button>
            </div>
        </div>

        <div id="quiz-step" class="hidden">
            <div class="bg-white rounded-2xl shadow-xl p-8 mb-6 border-t-8 border-indigo-600">
                <h3 class="text-2xl font-bold text-gray-800" id="display-student-name"></h3>
                <p class="text-gray-500" id="display-student-details"></p>
            </div>
            
            <form id="quiz-form" onsubmit="submitQuiz(event)">
                <div id="questions-container" class="space-y-6"></div>
                <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-xl transition text-xl shadow-lg mt-8">
                    📤 إرسال الإجابات
                </button>
            </form>
        </div>

        <div id="success-step" class="glass rounded-2xl shadow-xl p-10 text-center hidden">
            <div class="text-6xl mb-4">🎉</div>
            <h2 class="text-3xl font-extrabold text-green-600 mb-2">تم استلام إجاباتك بنجاح!</h2>
        </div>
    </div>

    <!-- نافذة منبثقة لعرض إجابات الطالب للمعلم -->
    <div id="answers-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl w-full max-w-2xl max-h-[80vh] flex flex-col">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-2xl">
                <h3 class="font-bold text-lg" id="modal-title">إجابات الطالب</h3>
                <button onclick="closeModal()" class="text-red-500 font-bold text-xl hover:text-red-700">&times;</button>
            </div>
            <div class="p-6 overflow-y-auto whitespace-pre-wrap text-gray-700" id="modal-content"></div>
        </div>
    </div>

    <script>
        // 🔴🔴🔴 ضع الرابط الجديد لـ Apps Script هنا 🔴🔴🔴
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyW_1trejULIz0AvvBkVTKW0Kg553kl7A_3mq2qyHdu7w3a1lLDDTfsSu-p5B1OJmc54g/exec'; 

        // === نظام التركيز الآمن ومكافحة الغش ===
        let isStudentActive = false;
        let cheatCount = 0;

        document.addEventListener('contextmenu', e => {
            if (isStudentActive) { e.preventDefault(); alert("⚠️ النقر بزر الفأرة الأيمن معطل أثناء الاختبار."); }
        });
        document.addEventListener('copy', e => {
            if (isStudentActive) { e.preventDefault(); alert("⚠️ النسخ معطل."); }
        });
        document.addEventListener('paste', e => {
            if (isStudentActive) { e.preventDefault(); alert("⚠️ اللصق معطل."); }
        });
        document.addEventListener('visibilitychange', () => {
            if (isStudentActive && document.visibilityState === 'hidden') {
                cheatCount++;
                alert("⛔ تنبيه أمني: لقد قمت بالخروج من صفحة الاختبار! تم تسجيل هذه المخالفة وإرسالها للمعلم.");
            }
        });

        // === وظائف الاختبار (إنشاء، عرض، إرسال) ===
        function parseQuestions(text) {
            const lines = text.split('\n').filter(line => line.trim() !== '');
            let questions = []; let currentQ = null;
            lines.forEach(line => {
                let textLine = line.trim();
                if (/^\d+[\.\-]\s/.test(textLine)) {
                    if (currentQ) questions.push(currentQ);
                    currentQ = { title: textLine, type: 'short', options: [] };
                    if (textLine.includes('...') || textLine.includes('___')) currentQ.type = 'fill';
                    else if (textLine.match(/اشرح|علل|وضح|تحدث|لماذا/)) currentQ.type = 'long';
                } else if (currentQ) {
                    if (/^[أبجدهxyzABCD][\)\.\-]\s/.test(textLine) || textLine.match(/^(صح|خطأ)$/)) {
                        currentQ.options.push(textLine);
                        currentQ.type = textLine.match(/^(صح|خطأ)$/) ? 'boolean' : 'mcq';
                    }
                }
            });
            if (currentQ) questions.push(currentQ); return questions;
        }

        function generateQuizLink() {
            const text = document.getElementById('questions-input').value;
            if(!text) return alert("أدخل الأسئلة أولاً!");
            const base64Data = btoa(unescape(encodeURIComponent(JSON.stringify(parseQuestions(text)))));
            const quizUrl = window.location.href.split('#')[0] + '#' + base64Data;
            navigator.clipboard.writeText(quizUrl).then(() => {
                document.getElementById('link-success').classList.remove('hidden');
                setTimeout(() => document.getElementById('link-success').classList.add('hidden'), 4000);
            });
        }

        function renderQuiz(questions) {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';
            questions.forEach((q, index) => {
                let html = `<div class="question-card bg-white p-6 rounded-2xl shadow-sm border border-gray-100"><h4 class="text-lg font-bold text-gray-800 mb-4">${q.title}</h4>`;
                if (q.type === 'mcq' || q.type === 'boolean') {
                    html += `<div class="space-y-2">`;
                    q.options.forEach((opt) => {
                        html += `<label class="flex items-center p-3 rounded-lg border border-gray-200 hover:bg-indigo-50 cursor-pointer"><input type="radio" name="q${index}" value="${opt}" class="w-5 h-5 text-indigo-600" required><span class="mr-3 text-gray-700">${opt}</span></label>`;
                    });
                    html += `</div>`;
                } else if (q.type === 'long') {
                    html += `<textarea name="q${index}" rows="4" class="w-full p-3 border border-gray-300 rounded-lg outline-none resize-none" placeholder="اكتب إجابتك هنا..." required></textarea>`;
                } else {
                    html += `<input type="text" name="q${index}" class="w-full p-3 border border-gray-300 rounded-lg outline-none" required>`;
                }
                container.innerHTML += html + `</div>`;
            });
        }

        window.onload = function() {
            const hash = window.location.hash.substring(1);
            if (hash) {
                document.getElementById('student-panel').classList.remove('hidden');
                try { window.quizData = JSON.parse(decodeURIComponent(escape(atob(hash)))); } 
                catch(e) { alert("رابط الاختبار غير صالح!"); }
            } else {
                document.getElementById('teacher-panel').classList.remove('hidden');
            }
        };

        function startQuiz() {
            const name = document.getElementById('s-name').value;
            const grade = document.getElementById('s-grade').value;
            const id = document.getElementById('s-id').value;
            if(!name || !grade || !id) return alert("أكمل بياناتك!");

            isStudentActive = true; // تفعيل وضع المراقبة
            
            document.getElementById('student-info-step').classList.add('hidden');
            document.getElementById('quiz-step').classList.remove('hidden');
            document.getElementById('display-student-name').innerText = "الطالب: " + name;
            document.getElementById('display-student-details').innerText = `الصف: ${grade} | الرقم: ${id}`;
            renderQuiz(window.quizData);
        }

        function submitQuiz(e) {
            e.preventDefault();
            isStudentActive = false; // إيقاف المراقبة بعد الإرسال
            const btn = document.getElementById('submit-btn');
            btn.innerText = "جاري الإرسال..."; btn.disabled = true;

            const formData = new FormData(e.target);
            let answers = {};
            window.quizData.forEach((q, index) => answers[q.title] = formData.get(`q${index}`));

            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "submit", studentName: document.getElementById('s-name').value, grade: document.getElementById('s-grade').value, studentId: document.getElementById('s-id').value, answers: answers, cheatCount: cheatCount })
            }).then(() => {
                document.getElementById('quiz-step').classList.add('hidden');
                document.getElementById('success-step').classList.remove('hidden');
            });
        }

        // === وظائف المعلم (جلب النتائج) ===
        function fetchResults() {
            const pwd = document.getElementById('teacher-password').value;
            if(!pwd) return alert("الرجاء إدخال كلمة المرور!");
            
            const btn = document.getElementById('fetch-btn');
            btn.innerText = "جاري الجلب...";
            
            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "fetch", password: pwd })
            }).then(res => res.json()).then(res => {
                btn.innerText = "🔍 جلب البيانات";
                if(res.status === "error") return alert(res.message);
                
                const tbody = document.getElementById('results-body');
                tbody.innerHTML = '';
                
                res.data.forEach((row, idx) => {
                    // row[1]: الاسم, row[2]: الصف, row[4]: الإجابات, row[5]: الغش
                    const cheatBadge = row[5] > 0 ? `<span class="bg-red-100 text-red-800 text-xs font-bold px-2 py-1 rounded">${row[5]} محاولات خروج</span>` : `<span class="text-green-600">ملتزم</span>`;
                    
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-gray-50";
                    tr.innerHTML = `
                        <td class="p-3 font-bold text-gray-800">${row[1]}</td>
                        <td class="p-3">${row[2]}</td>
                        <td class="p-3">${cheatBadge}</td>
                        <td class="p-3 text-center">
                            <button onclick='showAnswers(${JSON.stringify(row[4])})' class="bg-indigo-100 hover:bg-indigo-200 text-indigo-800 py-1 px-3 rounded text-sm font-bold">عرض الإجابات</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
                document.getElementById('results-container').classList.remove('hidden');
            }).catch(() => {
                alert("فشل الاتصال بالخادم. تأكد من صحة الرابط.");
                btn.innerText = "🔍 جلب البيانات";
            });
        }

        function showAnswers(answersText) {
            document.getElementById('modal-content').innerText = answersText;
            document.getElementById('answers-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('answers-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
